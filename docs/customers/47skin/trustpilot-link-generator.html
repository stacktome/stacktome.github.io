<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trustpilot Review Link</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h2 { margin-bottom: 4px; }
    .subtitle { color: #666; font-size: 13px; margin-bottom: 24px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; font-weight: 600; letter-spacing: .3px; }
    input { width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #00b67a; }
    button { padding: 10px 20px; font-size: 14px; cursor: pointer; border: none; border-radius: 5px; }
    button:disabled { opacity: .6; cursor: default; }
    .btn-create { background: #00b67a; color: #fff; font-weight: 600; margin-top: 4px; }
    .btn-create:hover:not(:disabled) { background: #009c69; }
    #status { font-size: 13px; color: #c33; margin-top: 12px; min-height: 18px; }
    #link-result { display: none; margin-top: 16px; padding: 12px 16px; background: #f4faf7; border: 1px solid #00b67a; border-radius: 5px; }
    #link-result strong { font-size: 12px; color: #555; }
    #link-out { display: block; word-break: break-all; font-family: monospace; font-size: 12px; margin: 6px 0 10px; color: #00b67a; text-decoration: none; }
    #link-out:hover { text-decoration: underline; }
    .btn-copy { background: #333; color: #fff; padding: 6px 14px; font-size: 12px; }
  </style>
</head>
<body>

<h2>Trustpilot Review Link</h2>
<p class="subtitle">Generate a personal review invitation link for a customer.</p>

<form id="link-form">
  <div class="field">
    <label for="name">Name</label>
    <input id="name" type="text" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" required>
  </div>
  <div class="field">
    <label for="reference">Reference (order ID)</label>
    <input id="reference" type="text" required>
  </div>
  <button type="submit" class="btn-create" id="btn-create">Create Link</button>
</form>

<div id="status"></div>

<div id="link-result">
  <strong>Invite link</strong>
  <a id="link-out" href="#" target="_blank"></a>
  <button type="button" class="btn-copy" id="btn-copy">Copy</button>
</div>

<script>
  // ── Fixed settings for 47skin ─────────────────────────────────────────────
  const API_KEY     = 'GkJ42PYuKYCaEihSK2qyRMENA5DypGg3';
  const WIDGET_ID   = '47';
  const LANDING_URL = 'https://reviews.47skin.com';
  const LOCALE      = '';   // optional, e.g. 'en-GB'
  const STAGING     = false;

  const BASE_URL = `https://services${STAGING ? '-staging' : ''}.stacktome.com`;
  const RENDER_URL = `${BASE_URL}/api/publish/v1/collect/widget/trustpilot/${WIDGET_ID}/render?apikey=${encodeURIComponent(API_KEY)}`;

  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('link-result');
  const linkOut  = document.getElementById('link-out');
  const btn      = document.getElementById('btn-create');

  document.getElementById('link-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name      = document.getElementById('name').value.trim();
    const email     = document.getElementById('email').value.trim();
    const reference = document.getElementById('reference').value.trim();
    if (!name || !email || !reference) { statusEl.textContent = 'Fill in all fields.'; return; }

    statusEl.textContent = '';
    resultEl.style.display = 'none';
    btn.textContent = 'Creating…';
    btn.disabled = true;

    try {
      const resp = await fetch(RENDER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, reference }),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.payload) { statusEl.textContent = `Error: ${data.error || 'No payload returned'}`; return; }

      const { data: d, iv, tag, sig } = data.payload;
      const url = LANDING_URL.replace(/\?.*$/, '')
        + '?data=' + encodeURIComponent(d)
        + '&iv='   + encodeURIComponent(iv)
        + '&tag='  + encodeURIComponent(tag)
        + '&sig='  + encodeURIComponent(sig)
        + (LOCALE ? '&locale=' + encodeURIComponent(LOCALE) : '');
      linkOut.href = url;
      linkOut.textContent = url;
      resultEl.style.display = 'block';
    } catch (err) {
      statusEl.textContent = 'Request failed: ' + err.message;
    } finally {
      btn.textContent = 'Create Link';
      btn.disabled = false;
    }
  });

  document.getElementById('btn-copy').addEventListener('click', () => {
    navigator.clipboard.writeText(linkOut.href);
    const copyBtn = document.getElementById('btn-copy');
    copyBtn.textContent = 'Copied ✓';
    setTimeout(() => copyBtn.textContent = 'Copy', 1500);
  });
</script>

</body>
</html>
