<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulevip Reviews — Live Render Test</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#fff}
  .host-nav{background:#0b3d2e;color:#fff;padding:14px 24px;font-size:15px}
  .host-nav a{color:#fff;text-decoration:none;margin-right:18px}
  .host-footer{background:#0b3d2e;color:#cfe8dd;padding:18px 24px;font-size:13px;margin-top:40px}
  .status{max-width:880px;margin:16px auto 0;padding:0 20px;font-size:13px;color:#67737f}
  .status.err{color:#c4453c}
</style>
</head>
<body>
<nav class="host-nav"><a href="https://www.bulevip.com">Bulevip</a> Node render test · production widget 773</nav>
<p class="status" id="status">Cargando el render en vivo desde services.stacktome.com…</p>
<main id="app"></main>
<div class="host-footer">Bulevip.com — host page chrome, not part of the render-service fragment</div>
<script>
// Internal test page ONLY — fetches the render fragment live, client-side, on every page load, so it
// always reflects current production state. Uses lvanguard_bulevip's org backend apikey directly in the
// browser, as the Wild Earth and SelectSpecs test pages do (explicitly approved for this noindex page).
// Never do this on a real customer-facing page.
var API_BASE = 'https://services.stacktome.com/api/reviews';
var APIKEY = '56GHToL9NZc0ZumrbVFnkT0EfrWVyqme';   // lvanguard_bulevip org backend key
var TEMPLATE_ID = '773';                            // lvanguard_bulevip "review-page" template
var ROOT_ID = 'bulevip-reviews';

var statusEl = document.getElementById('status');

fetch(API_BASE + '/v1/templates/' + TEMPLATE_ID + '/page', {
  method: 'POST',
  headers: { apikey: APIKEY, 'Content-Type': 'application/json' },
  body: JSON.stringify({ rootId: ROOT_ID }),
}).then(function(r){
  if (!r.ok) throw new Error('render service returned ' + r.status);
  return r.text();
}).then(function(html){
  var app = document.getElementById('app');
  app.innerHTML = html;

  // innerHTML never executes embedded <script> tags — the fragment's own pagination/filter/AI-box JS
  // lives in one, so it is re-created and re-inserted to actually run. The template sets its own
  // publicReviewsApiKey, so the render already stamps data-st-auth-value for the client-side calls.
  app.querySelectorAll('script').forEach(function(oldScript){
    var newScript = document.createElement('script');
    Array.prototype.forEach.call(oldScript.attributes, function(attr){ newScript.setAttribute(attr.name, attr.value); });
    newScript.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
  statusEl.textContent = 'Render en vivo obtenido el ' + new Date().toISOString();
}).catch(function(err){
  statusEl.className = 'status err';
  statusEl.textContent = 'Render fetch failed: ' + err.message;
});
</script>
</body>
</html>
